<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Logo - KIPER4D</title>
<style>
body { font-family: Arial; background: #0a0620; color: #fff; padding: 20px; margin: 0; }
.container { max-width: 900px; margin: auto; }
h1 { color: #ffd700; text-align: center; margin-bottom: 20px; }
.card { background: rgba(30,20,60,0.9); border: 1px solid rgba(168,85,247,0.3); border-radius: 14px; padding: 20px; margin-bottom: 15px; }
.btn { padding: 12px 24px; border: 0; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; margin-right: 10px; margin-bottom: 10px; }
.btn-blue { background: #3b82f6; color: #fff; }
.btn-green { background: #22c55e; color: #fff; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.status { padding: 12px 16px; border-radius: 10px; margin-top: 10px; font-size: 13px; }
.status.ok { background: rgba(34,197,94,0.15); border: 1px solid #22c55e; color: #86efac; }
.status.err { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #fca5a5; }
.status.wait { background: rgba(245,158,11,0.15); border: 1px solid #f59e0b; color: #fcd34d; }
.log { font-family: monospace; font-size: 11px; max-height: 400px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; margin-top: 10px; color: #0f0; line-height: 1.5; }
.team-item { display: flex; align-items: center; gap: 8px; padding: 6px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.team-item img { width: 30px; height: 30px; object-fit: contain; background: #fff; border-radius: 50%; padding: 2px; }
</style>
</head>
<body>
<div class="container">
<h1>🎨 AUTO FETCH LOGO v8 (Final)</h1>

<div class="card">
    <p>Wikipedia (filter ketat) + TheSportsDB (fallback). Filter timnas juga.</p>
    <button id="btnFetch" class="btn btn-blue">🔍 MULAI AMBIL LOGO</button>
    <button id="btnFetchOne" class="btn btn-green">🎯 Test 1 Tim</button>
    <div id="status"></div>
</div>

<div class="card">
    <h3>📋 Log</h3>
    <div id="log" class="log">Belum mulai...</div>
</div>

<div class="card">
    <h3>✅ Preview Logo yang Ditemukan</h3>
    <div id="preview">Belum ada logo.</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, writeBatch } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyB1i3mpTNKNlk54qQqk8xONAsaw66SOVs4",
    authDomain: "prediksipanel.firebaseapp.com",
    projectId: "prediksipanel",
    storageBucket: "prediksipanel.firebasestorage.app",
    messagingSenderId: "487032542947",
    appId: "1:487032542947:web:46a3d64e3abdece53e17d6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const WORKER_URL = "https://kiper4d-logo-proxy.giselachandra582.workers.dev";

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const previewEl = document.getElementById("preview");

function log(msg) {
    logEl.textContent += "\n" + msg;
    logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(msg, type) {
    statusEl.className = "status " + type;
    statusEl.textContent = msg;
}

function cleanTeam(name) {
    return String(name || "")
        .replace(/\[[^\]]*\]/g, "")
        .replace(/\([^)]*\)/g, "")
        .replace(/\s+/g, " ")
        .trim();
}

function normalizeKey(s) {
    return String(s || "").toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ").trim();
}

async function fetchViaWorker(url) {
    try {
        const finalUrl = WORKER_URL + "?url=" + encodeURIComponent(url);
        const res = await fetch(finalUrl);
        if (!res.ok) return null;
        const text = await res.text();
        try { return JSON.parse(text); } catch (e) { return null; }
    } catch (e) { return null; }
}

// === FILTER: beneran klub sepak bola (BUKAN timnas, BUKAN orang) ===
function isFootballClub(title, description, extract) {
    const t = (title || "").toLowerCase();
    const d = (description || "").toLowerCase();
    const e = (extract || "").toLowerCase().slice(0, 500);
    const haystack = d + " " + e;

    // Harus ada kata kunci sepak bola
    const footballKeywords = [
        "football club", "football team", "soccer club", "soccer team",
        "association football", "klub sepak bola", "tim sepak bola",
        "f.c.", "fc ", " afc", "soccer"
    ];
    const titleHasFC = /\b(fc|f\.c\.|sc|afc|cf)\b/i.test(title);
    const hasKeyword = footballKeywords.some(k => haystack.includes(k));

    // SKIP kalau ini TIMNAS (national team)
    const isNational = haystack.includes("national football team") 
        || haystack.includes("national soccer team")
        || haystack.includes("tim nasional")
        || haystack.includes("national team");

    // SKIP kalau ini orang
    const notFootball = [
        "presiden", "politikus", "aktor", "aktris", "penyanyi",
        "president", "politician", "actor", "actress", "singer",
        "born in", "lahir", "pemain sepak bola", "footballer",
        "pemain sepakbola", "player", "pemain"
    ];
    const isPerson = notFootball.some(k => d.includes(k) || e.slice(0, 200).includes(k));

    return (hasKeyword || titleHasFC) && !isNational && !isPerson;
}

// === Wikipedia search + filter ===
async function searchWikipediaRest(teamName, lang) {
    const name = cleanTeam(teamName);
    if (!name) return null;

    try {
        const searchUrl = `https://${lang}.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(name)}&limit=5`;
        const searchData = await fetchViaWorker(searchUrl);
        if (!searchData || !searchData.pages || !searchData.pages.length) return null;

        for (const page of searchData.pages) {
            const pageKey = page.key;
            const title = page.title;
            const desc = page.description || "";

            const teamKey = normalizeKey(name);
            const titleKey = normalizeKey(title);
            const titleMatch = titleKey.includes(teamKey) || teamKey.includes(titleKey);
            if (!titleMatch) continue;

            const summaryUrl = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(pageKey)}`;
            const summary = await fetchViaWorker(summaryUrl);
            if (!summary) continue;

            if (!isFootballClub(title, desc, summary.extract || "")) continue;

            const thumb = summary.thumbnail?.source || summary.originalimage?.source;
            if (thumb) {
                return { name: title, logo: thumb, source: "wiki-" + lang };
            }
        }
    } catch (e) {}
    return null;
}

// === TheSportsDB fallback ===
async function searchTheSportsDB(teamName) {
    const name = cleanTeam(teamName);
    if (!name) return null;

    const variants = [
        name,
        name.replace(/\s+(FC|SC|CF|AFC|AC|AS|SK|IF|BK|SV|KV|NK|Utd|United|City)$/i, "").trim()
    ];

    for (const variant of variants) {
        if (!variant) continue;
        const url = `https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${encodeURIComponent(variant)}`;
        const data = await fetchViaWorker(url);
        if (!data || !data.teams || !data.teams.length) continue;

        const soccerTeams = data.teams.filter(t => t.strSport === "Soccer");
        if (!soccerTeams.length) continue;

        const nameLower = variant.toLowerCase();
        let best = soccerTeams[0];
        for (const t of soccerTeams) {
            const tn = (t.strTeam || "").toLowerCase();
            if (tn === nameLower) { best = t; break; }
            if (tn.includes(nameLower) || nameLower.includes(tn)) best = t;
        }

        const logo = best.strTeamBadge || best.strTeamLogo || "";
        if (logo) return { name: best.strTeam, logo: logo, source: "tsdb" };
    }
    return null;
}

async function findLogo(teamName) {
    // Wikipedia dulu (kualitas lebih bagus)
    let r = await searchWikipediaRest(teamName, "id");
    if (r) return r;
    r = await searchWikipediaRest(teamName, "en");
    if (r) return r;
    // Fallback TheSportsDB
    r = await searchTheSportsDB(teamName);
    if (r) return r;
    return null;
}

function showPreview(team, r) {
    previewEl.innerHTML = `
        <div class="team-item">
            <img src="${r.logo}" onerror="this.style.display='none'">
            <span><b>${team}</b> → ${r.name} <small>(${r.source})</small></span>
        </div>
    `;
}

// TEST 1 TIM
document.getElementById("btnFetchOne").addEventListener("click", async () => {
    const teamName = prompt("Nama tim:", "Persija Jakarta");
    if (!teamName) return;

    setStatus("⏳ Cari: " + teamName, "wait");
    logEl.textContent = "Test: " + teamName;

    log("\n1. Wikipedia ID...");
    let r = await searchWikipediaRest(teamName, "id");
    if (r) {
        log("  ✅ " + r.name + " [" + r.source + "]");
        showPreview(teamName, r);
        setStatus("✅ ID: " + r.name, "ok");
        return;
    }
    log("  ❌ ID tidak ketemu");

    log("\n2. Wikipedia EN...");
    r = await searchWikipediaRest(teamName, "en");
    if (r) {
        log("  ✅ " + r.name + " [" + r.source + "]");
        showPreview(teamName, r);
        setStatus("✅ EN: " + r.name, "ok");
        return;
    }
    log("  ❌ EN tidak ketemu");

    log("\n3. TheSportsDB...");
    r = await searchTheSportsDB(teamName);
    if (r) {
        log("  ✅ " + r.name + " [" + r.source + "]");
        showPreview(teamName, r);
        setStatus("✅ TSDB: " + r.name, "ok");
        return;
    }
    log("  ❌ TSDB tidak ketemu");

    setStatus("❌ Tidak ketemu: " + teamName, "err");
});

// MASSAL
document.getElementById("btnFetch").addEventListener("click", async () => {
    if (!confirm("Proses semua tim? Bisa 15-25 menit.")) return;

    const btn = document.getElementById("btnFetch");
    btn.disabled = true;
    btn.textContent = "⏳ Proses...";
    logEl.textContent = "Mulai...";
    previewEl.innerHTML = "";

    try {
        setStatus("📖 Baca Firestore...", "wait");
        const snap = await getDocs(collection(db, "predictions"));
        log("Total dokumen: " + snap.size);

        const teamSet = new Set();
        const docs = [];
        snap.forEach(d => {
            const data = d.data();
            if (data.home) teamSet.add(cleanTeam(data.home));
            if (data.away) teamSet.add(cleanTeam(data.away));
            docs.push({ id: d.id, data: data });
        });

        const uniqueTeams = [...teamSet].filter(Boolean);
        log("Tim unik: " + uniqueTeams.length);

        const logoMap = new Map();
        let found = 0, notFound = 0;
        let wikiCount = 0, tsdbCount = 0;

        for (let i = 0; i < uniqueTeams.length; i++) {
            const team = uniqueTeams[i];
            log(`[${i+1}/${uniqueTeams.length}] ${team}`);

            const result = await findLogo(team);

            if (result && result.logo) {
                logoMap.set(team.toLowerCase(), result.logo);
                found++;
                if (result.source.startsWith("wiki")) wikiCount++;
                else if (result.source === "tsdb") tsdbCount++;
                log(`  ✅ ${result.name} [${result.source}]`);
                previewEl.innerHTML = `
                    <div class="team-item">
                        <img src="${result.logo}" onerror="this.style.display='none'">
                        <span><b>${team}</b> → ${result.name} <small>(${result.source})</small></span>
                    </div>
                ` + previewEl.innerHTML;
            } else {
                notFound++;
                log(`  ❌ Tidak ketemu`);
            }

            await new Promise(r => setTimeout(r, 150));
        }

        setStatus(`✅ Wiki: ${wikiCount} | TSDB: ${tsdbCount} | Gagal: ${notFound}`, "ok");
        log(`\n📝 Update Firestore...`);

        let batch = writeBatch(db);
        let count = 0, updated = 0;

        for (const d of docs) {
            const home = cleanTeam(d.data.home).toLowerCase();
            const away = cleanTeam(d.data.away).toLowerCase();
            const homeLogo = logoMap.get(home) || d.data.homeLogo || "";
            const awayLogo = logoMap.get(away) || d.data.awayLogo || "";

            if (homeLogo || awayLogo) {
                batch.update(doc(db, "predictions", d.id), {
                    homeLogo: homeLogo,
                    awayLogo: awayLogo
                });
                updated++;
                count++;
                if (count >= 400) {
                    await batch.commit();
                    batch = writeBatch(db);
                    count = 0;
                }
            }
        }
        if (count > 0) await batch.commit();

        log(`✅ ${updated} dokumen di-update`);
        setStatus(`🎉 SELESAI! Wiki: ${wikiCount}, TSDB: ${tsdbCount}, Total: ${found}. Hard refresh situs!`, "ok");

    } catch (err) {
        console.error(err);
        setStatus("❌ Error: " + err.message, "err");
    }

    btn.disabled = false;
    btn.textContent = "🔍 MULAI AMBIL LOGO";
});

</script>
</body>
</html>
