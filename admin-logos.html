<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Logo - KIPER4D</title>
<style>
body { font-family: Arial; background: #0a0620; color: #fff; padding: 20px; margin: 0; }
.container { max-width: 900px; margin: auto; }
h1 { color: #ffd700; text-align: center; margin-bottom: 20px; }
.card { background: rgba(30,20,60,0.9); border: 1px solid rgba(168,85,247,0.3); border-radius: 14px; padding: 20px; margin-bottom: 15px; }
.btn { padding: 12px 24px; border: 0; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; margin-right: 10px; margin-bottom: 10px; }
.btn-blue { background: #3b82f6; color: #fff; }
.btn-green { background: #22c55e; color: #fff; }
.btn-red { background: #dc2626; color: #fff; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.status { padding: 12px 16px; border-radius: 10px; margin-top: 10px; font-size: 13px; }
.status.ok { background: rgba(34,197,94,0.15); border: 1px solid #22c55e; color: #86efac; }
.status.err { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #fca5a5; }
.status.wait { background: rgba(245,158,11,0.15); border: 1px solid #f59e0b; color: #fcd34d; }
.log { font-family: monospace; font-size: 11px; max-height: 400px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; margin-top: 10px; color: #0f0; line-height: 1.5; }
.team-item { display: flex; align-items: center; gap: 8px; padding: 6px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.team-item img { width: 24px; height: 24px; object-fit: contain; background: #fff; border-radius: 50%; padding: 2px; }
</style>
</head>
<body>
<div class="container">
<h1>🎨 AUTO FETCH LOGO TIM</h1>

<div class="card">
    <p>Klik tombol di bawah untuk auto-cari logo tim dari TheSportsDB dan simpan ke Firestore.</p>
    <button id="btnFetch" class="btn btn-blue">🔍 MULAI AMBIL LOGO</button>
    <button id="btnFetchOne" class="btn btn-green">🎯 Test 1 Tim</button>
    <div id="status"></div>
</div>

<div class="card">
    <h3>📋 Log</h3>
    <div id="log" class="log">Belum mulai...</div>
</div>

<div class="card">
    <h3>✅ Preview Logo yang Ditemukan</h3>
    <div id="preview">Belum ada logo.</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyB1i3mpTNKNlk54qQqk8xONAsaw66SOVs4",
    authDomain: "prediksipanel.firebaseapp.com",
    projectId: "prediksipanel",
    storageBucket: "prediksipanel.firebasestorage.app",
    messagingSenderId: "487032542947",
    appId: "1:487032542947:web:46a3d64e3abdece53e17d6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const TSDB = "https://www.thesportsdb.com/api/v1/json/123";

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const previewEl = document.getElementById("preview");

function log(msg) {
    logEl.textContent += "\n" + msg;
    logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(msg, type) {
    statusEl.className = "status " + type;
    statusEl.textContent = msg;
}

async function searchTeamLogo(teamName) {
    try {
        const url = `${TSDB}/searchteams.php?t=${encodeURIComponent(teamName)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.teams || !data.teams.length) return null;
        const team = data.teams[0];
        return {
            name: team.strTeam,
            logo: team.strTeamBadge || team.strTeamLogo || "",
            league: team.strLeague || ""
        };
    } catch (e) {
        return null;
    }
}

document.getElementById("btnFetchOne").addEventListener("click", async () => {
    const teamName = prompt("Nama tim yang mau dicari:", "Persija");
    if (!teamName) return;
    setStatus("Cari: " + teamName, "wait");
    const result = await searchTeamLogo(teamName);
    if (result) {
        setStatus("✅ Ditemukan: " + result.name, "ok");
        previewEl.innerHTML = `
            <div class="team-item">
                <img src="${result.logo}">
                <b>${result.name}</b> — ${result.league}
                <br><small>${result.logo}</small>
            </div>
        `;
    } else {
        setStatus("❌ Tidak ditemukan", "err");
    }
});

document.getElementById("btnFetch").addEventListener("click", async () => {
    const btn = document.getElementById("btnFetch");
    btn.disabled = true;
    btn.textContent = "⏳ Sedang proses...";
    logEl.textContent = "Mulai...";
    previewEl.innerHTML = "";

    try {
        setStatus("📖 Baca data Firestore...", "wait");
        const snap = await getDocs(collection(db, "predictions"));
        log("Total dokumen: " + snap.size);

        // Kumpulkan nama tim unik
        const teamSet = new Set();
        const docs = [];
        snap.forEach(d => {
            const data = d.data();
            if (data.home) teamSet.add(data.home);
            if (data.away) teamSet.add(data.away);
            docs.push({ id: d.id, data: data });
        });

        const uniqueTeams = [...teamSet];
        log("Tim unik: " + uniqueTeams.length);

        // Cari logo untuk setiap tim
        const logoMap = new Map(); // nama -> url
        let found = 0;
        let notFound = 0;

        for (let i = 0; i < uniqueTeams.length; i++) {
            const team = uniqueTeams[i];
            log(`[${i+1}/${uniqueTeams.length}] Cari: ${team}`);

            const result = await searchTeamLogo(team);
            if (result && result.logo) {
                logoMap.set(team.toLowerCase(), result.logo);
                found++;
                log(`  ✅ ${result.name} → logo OK`);

                previewEl.innerHTML += `
                    <div class="team-item">
                        <img src="${result.logo}" onerror="this.style.display='none'">
                        <span><b>${team}</b> → ${result.name}</span>
                    </div>
                `;
            } else {
                notFound++;
                log(`  ❌ Tidak ketemu`);
            }

            // Delay biar gak kena rate limit TheSportsDB
            await new Promise(r => setTimeout(r, 200));
        }

        setStatus(`✅ Logo ditemukan: ${found} | Tidak ketemu: ${notFound}`, "ok");
        log(`\n=== SELESAI CARI LOGO ===`);
        log(`Ditemukan: ${found}`);
        log(`Tidak ditemukan: ${notFound}`);

        // Update Firestore
        log(`\n📝 Update Firestore...`);
        setStatus("📝 Update Firestore...", "wait");

        let batch = writeBatch(db);
        let count = 0;
        let updated = 0;

        for (const d of docs) {
            const home = (d.data.home || "").toLowerCase();
            const away = (d.data.away || "").toLowerCase();
            const homeLogo = logoMap.get(home) || "";
            const awayLogo = logoMap.get(away) || "";

            if (homeLogo || awayLogo) {
                batch.update(doc(db, "predictions", d.id), {
                    homeLogo: homeLogo,
                    awayLogo: awayLogo
                });
                updated++;
                count++;
                if (count >= 400) {
                    await batch.commit();
                    batch = writeBatch(db);
                    count = 0;
                }
            }
        }
        if (count > 0) await batch.commit();

        log(`✅ Selesai update ${updated} dokumen`);
        setStatus(`🎉 SELESAI! ${found} logo ditemukan, ${updated} dokumen di-update. Refresh situs!`, "ok");

    } catch (err) {
        console.error(err);
        setStatus("❌ Error: " + err.message, "err");
        log("ERROR: " + err.message);
    }

    btn.disabled = false;
    btn.textContent = "🔍 MULAI AMBIL LOGO";
});
</script>
</body>
</html>
